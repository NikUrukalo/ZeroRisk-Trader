% rebase('base.html')

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card">

                <div class="card-header">
                    <h3 class="mb-0">Add Balance</h3>
                </div>

                <div class="card-body">

                    % if error:
                        <div class="alert alert-danger">
                            {{error}}
                        </div>
                    % end

                    % if success:
                        <div class="alert alert-success">
                            {{success}}
                        </div>
                    % end


                    <div class="mb-4">

                        <h5>Current Balance</h5>

                        <h2>
                            €{{"%.2f" % balance}}
                        </h2>

                    </div>


                    <form action="/add_balance" method="POST">

                        <div class="mb-3">

                            <label
                                for="amount"
                                class="form-label"
                            >
                                Amount to add
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    €
                                </span>

                                <input
                                    type="number"
                                    id="amount"
                                    name="amount"
                                    class="form-control"
                                    min="0.01"
                                    step="0.01"
                                    placeholder="Enter amount"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Add Balance
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
