% setdefault('path', '/')
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZeroRisk Trader</title>

    <link rel="icon" href="{{ url('/static/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url('/static/style.css?v=3') }}">
</head>

<body>

<nav class="navbar navbar-expand navbar-dark navigation-navy mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url('/') }}">Zero<span>Risk</span> Trader</a>

        <div class="navbar-nav ms-auto">
            % if user:
                <a class="nav-link {{ 'active' if path == '/overview' else '' }}" href="{{ url('/overview') }}">Overview</a>
                <a class="nav-link {{ 'active' if path == '/trade' else '' }}" href="{{ url('/trade') }}">Trade</a>
                <a class="nav-link {{ 'active' if path == '/add_balance' else '' }}" href="{{ url('/add_balance') }}">Earn balance</a>
                <a class="nav-link" href="{{ url('/logout') }}">Log out</a>
            % else:
                <a class="nav-link {{ 'active' if path in ('/', '/login') else '' }}" href="{{ url('/login') }}">Log in</a>
                <a class="nav-link {{ 'active' if path == '/register' else '' }}" href="{{ url('/register') }}">Register</a>
            % end
        </div>
    </div>
</nav>

<div class="container">
    {{!base}}
</div>

<footer class="site-footer">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
        <span>ZeroRisk Trader &mdash; practice trading with virtual money. Prices are delayed snapshots.</span>
        <span>Osnove podatkovnih baz &middot; FMF &middot; 2026</span>
    </div>
</footer>

</body>
</html>
