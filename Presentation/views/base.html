<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>ZeroRisk Trader</title>

    <!-- link to bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- link to our CSS -->
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>

<body class="bg-light text-dark">

    <!-- navigation bar -->
    <nav class="navbar navbar-expand navbar-dark navigation-navy mb-4">
        <div class="container">
            <!-- href="/" takes user to the root URL -->
            <a class="navbar-brand" href="/">ZeroRisk Trader</a>

        <div class="navbar-nav">
            % if user:
                <a class="nav-link" href="/overview">Overview</a>
                <a class="nav-link" href="/trade">Trade</a>
                <a class="nav-link" href="/add_balance">Add balance</a>
                <a class="nav-link" href="/logout">Logout</a>
            % else:
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link" href="/register">New User</a>
            % end
        </div>
    </div>
</nav>

    <div class="container">
        <!-- Child template content is injected here -->
        {{!base}}
    </div>
</body>

</html>
