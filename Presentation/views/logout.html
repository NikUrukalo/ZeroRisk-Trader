% rebase('base.html')

<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-3">Log Out</h3>
                <p class="text-muted mb-4">Are you sure you want to end your current session?</p>
                
                <form action="{{ url('/logout') }}" method="POST">
                    <button type="submit" class="btn btn-danger me-2">Log Out</button>
                    <a href="{{ url('/overview') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
